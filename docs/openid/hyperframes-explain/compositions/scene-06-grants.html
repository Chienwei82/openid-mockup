<template>
  <div
    class="scene-root"
    data-composition-id="scene-06-grants"
    data-width="1920"
    data-height="1080"
    data-duration="23.02"
  >
<section class="scene"><header class="scene__head"><span class="kicker" data-anim="pop">Grants</span><h2 class="headline" data-anim="rise">Token Endpoint y Grant Types</h2></header><p class="mono" data-anim="fade" data-hl="line-token">POST /connect/token</p><div class="statrow"><div class="stat" data-anim="pop" data-hl="stat-grants"><span class="stat__num">7</span><span class="stat__label">grant types anunciados</span></div><div class="stat" data-anim="pop"><span class="stat__num">6</span><span class="stat__label">endpoints de protocolo</span></div><div class="stat" data-anim="pop" data-hl="stat-handler"><span class="stat__num">1</span><span class="stat__label">handler por grant</span></div></div><div class="chiprow" data-anim="fade"><span class="chip" data-hl="chip-authorization-code">authorization_code</span><span class="chip" data-hl="chip-refresh-token">refresh_token</span><span class="chip" data-hl="chip-client-credentials">client_credentials</span><span class="chip" data-hl="chip-password">password</span><span class="chip" data-hl="chip-device-code">device_code</span><span class="chip" data-hl="chip-ciba">ciba</span><span class="chip" data-hl="chip-implicit">implicit</span></div></section>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="scene-06-grants"]');
        if (!root || typeof gsap === 'undefined') { return; }
        var timeline = gsap.timeline({ paused: true });

        var FROM = {
          rise: { opacity: 0, y: 36 },
          pop: { opacity: 0, y: 22, scale: 0.92 },
          slide: { opacity: 0, x: -40 },
          fade: { opacity: 0 },
        };
        var items = root.querySelectorAll('[data-anim]');
        for (var index = 0; index < items.length; index += 1) {
          var from = FROM[items[index].getAttribute('data-anim')] || FROM.rise;
          timeline.from(
            items[index],
            Object.assign({ duration: 0.65, ease: 'power3.out' }, from),
            0.45 + index * 0.24
          );
        }

        var HIGHLIGHTS = {"line-token": [[1.004, 2.181]], "stat-grants": [[7.406, 8.803]], "chip-authorization-code": [[9.053, 10.229]], "chip-refresh-token": [[10.509, 11.568]], "chip-client-credentials": [[11.862, 13.141]], "chip-password": [[13.465, 13.994]], "chip-device-code": [[14.259, 15.024]], "chip-ciba": [[15.385, 15.797]], "chip-implicit": [[15.885, 16.621]], "stat-handler": [[18.925, 20.087]]};
        var targets = [];
        Object.keys(HIGHLIGHTS).forEach(function (key) {
          var el = root.querySelector('[data-hl="' + key + '"]');
          if (el) { targets.push({ el: el, windows: HIGHLIGHTS[key] }); }
        });
        var ATTACK = 0.22;
        var RELEASE = 0.55;
        function envelope(time, start, end) {
          if (time < start) { return 0; }
          if (time < end) { return Math.min((time - start) / ATTACK, 1); }
          if (time < end + RELEASE) { return 1 - (time - end) / RELEASE; }
          return 0;
        }
        function paint(target, env) {
          var el = target.el;
          if (env <= 0.001) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
            el.style.textShadow = '';
            return;
          }
          el.style.borderColor =
            'rgb(' + Math.round(58 + 19 * env) + ', ' + Math.round(63 + 145 * env) + ', ' + Math.round(71 + 154 * env) + ')';
          el.style.boxShadow = '0 0 ' + (36 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.28 * env).toFixed(3) + ')';
          el.style.textShadow = '0 0 ' + (16 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.4 * env).toFixed(3) + ')';
        }
        var driver = { t: 0 };
        timeline.to(
          driver,
          {
            t: 23.02,
            duration: 23.02,
            ease: 'none',
            onUpdate: function () {
              for (var i = 0; i < targets.length; i += 1) {
                var env = 0;
                for (var w = 0; w < targets[i].windows.length; w += 1) {
                  env = Math.max(env, envelope(driver.t, targets[i].windows[w][0], targets[i].windows[w][1]));
                }
                paint(targets[i], env);
              }
            },
          },
          0
        );

        window.__timelines['scene-06-grants'] = timeline;
      })();
    </script>
  </div>
</template>
