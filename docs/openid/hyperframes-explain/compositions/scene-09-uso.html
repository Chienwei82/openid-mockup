<template>
  <div
    class="scene-root"
    data-composition-id="scene-09-uso"
    data-width="1920"
    data-height="1080"
    data-duration="29.02"
  >
<section class="scene"><header class="scene__head"><span class="kicker" data-anim="pop">Pasos 5 y 6 del mapa</span><h2 class="headline" data-anim="rise">UserInfo, API y Revocación</h2></header><p class="where" data-anim="fade"><span class="where__label">Estás aquí</span><span class="where__crumb"><span class="where__n">1</span>Discovery</span><span class="where__crumb"><span class="where__n">2-3</span>Authorize</span><span class="where__crumb"><span class="where__n">4</span>Canje</span><span class="where__crumb where__crumb--on"><span class="where__n">5-6</span>Uso</span></p><div class="lanes"><div class="lane" data-anim="rise"><p class="lane__name">OP · OidcMock</p><p class="hop" data-hl="uso-userinfo"><span class="hop__n">1</span><code>GET /connect/userinfo</code> devuelve los claims del usuario</p><p class="hop" data-hl="uso-introspection"><span class="hop__n">2</span><code>POST /connect/introspect</code> responde <code>active</code> true o false</p><p class="hop" data-hl="uso-revocation"><span class="hop__n">3</span><code>POST /connect/revocation</code> registra el <code>jti</code></p></div><div class="lane lane--off" data-anim="rise"><p class="lane__name">API</p><p class="hop hop--off" data-hl="uso-api"><span class="hop__n">1</span>Valida la firma contra el JWKS y sirve los datos</p></div></div></section>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="scene-09-uso"]');
        if (!root || typeof gsap === 'undefined') { return; }
        var timeline = gsap.timeline({ paused: true });

        var FROM = {
          rise: { opacity: 0, y: 36 },
          pop: { opacity: 0, y: 22, scale: 0.92 },
          slide: { opacity: 0, x: -40 },
          fade: { opacity: 0 },
        };
        var items = root.querySelectorAll('[data-anim]');
        for (var index = 0; index < items.length; index += 1) {
          var from = FROM[items[index].getAttribute('data-anim')] || FROM.rise;
          timeline.from(
            items[index],
            Object.assign({ duration: 0.65, ease: 'power3.out' }, from),
            0.45 + index * 0.24
          );
        }

        var HIGHLIGHTS = {"uso-userinfo": [[4.718, 7.028]], "uso-api": [[9.738, 13.183]], "uso-introspection": [[15.522, 17.721]], "uso-revocation": [[22.455, 24.163]]};
        var targets = [];
        Object.keys(HIGHLIGHTS).forEach(function (key) {
          var el = root.querySelector('[data-hl="' + key + '"]');
          if (el) { targets.push({ el: el, windows: HIGHLIGHTS[key] }); }
        });
        var ATTACK = 0.22;
        var RELEASE = 0.55;
        function envelope(time, start, end) {
          if (time < start) { return 0; }
          if (time < end) { return Math.min((time - start) / ATTACK, 1); }
          if (time < end + RELEASE) { return 1 - (time - end) / RELEASE; }
          return 0;
        }
        function paint(target, env) {
          var el = target.el;
          if (env <= 0.001) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
            el.style.textShadow = '';
            return;
          }
          el.style.borderColor =
            'rgb(' + Math.round(58 + 19 * env) + ', ' + Math.round(63 + 145 * env) + ', ' + Math.round(71 + 154 * env) + ')';
          el.style.boxShadow = '0 0 ' + (36 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.28 * env).toFixed(3) + ')';
          el.style.textShadow = '0 0 ' + (16 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.4 * env).toFixed(3) + ')';
        }
        var driver = { t: 0 };
        timeline.to(
          driver,
          {
            t: 29.02,
            duration: 29.02,
            ease: 'none',
            onUpdate: function () {
              for (var i = 0; i < targets.length; i += 1) {
                var env = 0;
                for (var w = 0; w < targets[i].windows.length; w += 1) {
                  env = Math.max(env, envelope(driver.t, targets[i].windows[w][0], targets[i].windows[w][1]));
                }
                paint(targets[i], env);
              }
            },
          },
          0
        );

        window.__timelines['scene-09-uso'] = timeline;
      })();
    </script>
  </div>
</template>
