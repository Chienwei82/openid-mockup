<template>
  <div
    class="scene-root"
    data-composition-id="scene-06-idtoken"
    data-width="1920"
    data-height="1080"
    data-duration="28.132"
  >
<section class="scene"><header class="scene__head"><span class="kicker" data-anim="pop">Paso 4b del mapa</span><h2 class="headline" data-anim="rise">El ID Token</h2></header><p class="where" data-anim="fade"><span class="where__label">Estás aquí</span><span class="where__crumb"><span class="where__n">1</span>Discovery</span><span class="where__crumb"><span class="where__n">2-3</span>Authorize</span><span class="where__crumb where__crumb--on"><span class="where__n">4</span>Canje</span><span class="where__crumb"><span class="where__n">5-6</span>Uso</span></p><div class="use"><p class="use__q" data-anim="pop">¿Qué trae el id token?</p><div class="use__branches"><article class="use__branch" data-anim="rise" data-hl="card-claims"><h3 class="use__when">Identidad</h3><p class="use__go"><code>sub</code>, <code>name</code>, <code>email</code></p><p class="use__note">quién es el usuario</p></article><article class="use__branch" data-anim="rise" data-hl="card-tiempos"><h3 class="use__when">Validez</h3><p class="use__go"><code>iss</code>, <code>aud</code>, <code>exp</code>, <code>iat</code></p><p class="use__note">quién lo emite y hasta cuándo vale</p></article><article class="use__branch" data-anim="rise" data-hl="card-sesion"><h3 class="use__when">Sesión</h3><p class="use__go"><code>sid</code>, <code>auth_time</code>, <code>nonce</code></p><p class="use__note">a qué login pertenece</p></article></div></div><p class="note" data-anim="fade">Solo aparece cuando pides el scope <code>openid</code>.</p></section>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="scene-06-idtoken"]');
        if (!root || typeof gsap === 'undefined') { return; }
        var timeline = gsap.timeline({ paused: true });

        var FROM = {
          rise: { opacity: 0, y: 36 },
          pop: { opacity: 0, y: 22, scale: 0.92 },
          slide: { opacity: 0, x: -40 },
          fade: { opacity: 0 },
        };
        var items = root.querySelectorAll('[data-anim]');
        for (var index = 0; index < items.length; index += 1) {
          var from = FROM[items[index].getAttribute('data-anim')] || FROM.rise;
          timeline.from(
            items[index],
            Object.assign({ duration: 0.65, ease: 'power3.out' }, from),
            0.45 + index * 0.24
          );
        }

        var HIGHLIGHTS = {"chip-iss": [[11.488, 12.273]], "chip-sub": [[12.651, 12.959]], "chip-aud": [[13.267, 13.533]], "chip-exp": [[13.841, 14.163]], "chip-iat": [[14.485, 14.794]], "chip-nonce": [[14.892, 15.368]], "chiprow-binding": [[16.348, 17.581]], "card-scope": [[25.06, 26.166]]};
        var RAILS = [];
        var TOKENS = [];
        var rails = root.querySelectorAll('.flow__rail');
        for (var rail = 0; rail < rails.length; rail += 1) {
          var span = RAILS[rail] || [0, 0.6];
          timeline.fromTo(
            rails[rail],
            { scaleY: 0 },
            { scaleY: 1, duration: Math.max(span[1] - span[0], 0.4), ease: 'power2.out' },
            span[0]
          );
        }
        var tokens = root.querySelectorAll('.flow__token');
        for (var tok = 0; tok < tokens.length; tok += 1) {
          var win = TOKENS[tok] || [0, 0];
          timeline.fromTo(
            tokens[tok],
            { opacity: 0, scale: 0 },
            { opacity: 1, scale: 1, duration: 0.35, ease: 'power3.out' },
            Math.max(win[0] - 0.15, 0)
          );
          timeline.to(tokens[tok], { opacity: 0.25, duration: 0.5, ease: 'power1.out' }, win[1]);
        }
        var targets = [];
        Object.keys(HIGHLIGHTS).forEach(function (key) {
          var el = root.querySelector('[data-hl="' + key + '"]');
          if (el) { targets.push({ el: el, windows: HIGHLIGHTS[key] }); }
        });
        var ATTACK = 0.22;
        var RELEASE = 0.55;
        function envelope(time, start, end) {
          if (time < start) { return 0; }
          if (time < end) { return Math.min((time - start) / ATTACK, 1); }
          if (time < end + RELEASE) { return 1 - (time - end) / RELEASE; }
          return 0;
        }
        function paint(target, env) {
          var el = target.el;
          if (env <= 0.001) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
            el.style.textShadow = '';
            return;
          }
          el.style.borderColor =
            'rgb(' + Math.round(58 + 19 * env) + ', ' + Math.round(63 + 145 * env) + ', ' + Math.round(71 + 154 * env) + ')';
          el.style.boxShadow = '0 0 ' + (36 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.28 * env).toFixed(3) + ')';
          el.style.textShadow = '0 0 ' + (16 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.4 * env).toFixed(3) + ')';
        }
        var driver = { t: 0 };
        timeline.to(
          driver,
          {
            t: 28.132,
            duration: 28.132,
            ease: 'none',
            onUpdate: function () {
              for (var i = 0; i < targets.length; i += 1) {
                var env = 0;
                for (var w = 0; w < targets[i].windows.length; w += 1) {
                  env = Math.max(env, envelope(driver.t, targets[i].windows[w][0], targets[i].windows[w][1]));
                }
                paint(targets[i], env);
              }
            },
          },
          0
        );

        window.__timelines['scene-06-idtoken'] = timeline;
      })();
    </script>
  </div>
</template>
