<template>
  <div
    class="scene-root"
    data-composition-id="scene-08-grants"
    data-width="1920"
    data-height="1080"
    data-duration="27.604"
  >
<section class="scene"><header class="scene__head"><span class="kicker" data-anim="pop">Paso 4, otros caminos</span><h2 class="headline" data-anim="rise">Otros Grant Types</h2></header><p class="where" data-anim="fade"><span class="where__label">Estás aquí</span><span class="where__crumb"><span class="where__n">1</span>Discovery</span><span class="where__crumb"><span class="where__n">2-3</span>Authorize</span><span class="where__crumb where__crumb--on"><span class="where__n">4</span>Canje</span><span class="where__crumb"><span class="where__n">5-6</span>Uso</span></p><p class="use__q" data-anim="pop">El mismo token endpoint atiende otros caminos</p><div class="grid grid--grants"><article class="card" data-motion="pop" data-hl="card-refresh"><h3 class="card__title"><span class="tok tok--refresh">refresh_token</span></h3><p class="grant__say">pide tokens nuevos sin login</p><p class="grant__note">rota en cada uso</p></article><article class="card" data-motion="pop" data-hl="card-client"><h3 class="card__title"><span class="tok tok--access">client_credentials</span></h3><p class="grant__say">emite tokens de servicio</p><p class="grant__note">sin usuario, con secreto</p></article><article class="card" data-motion="pop" data-hl="card-password"><h3 class="card__title"><span class="tok tok--code">password</span></h3><p class="grant__say">valida usuario y contraseña</p><p class="grant__note">directamente, en un solo paso</p></article><article class="card" data-motion="pop" data-hl="card-device"><h3 class="card__title"><span class="tok tok--id">device_code · CIBA</span></h3><p class="grant__say">grants simulados</p><p class="grant__note">completan el discovery</p></article></div><p class="note" data-anim="fade">El camino feliz sigue siendo <code>authorization_code</code> + PKCE.</p></section>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="scene-08-grants"]');
        if (!root || typeof gsap === 'undefined') { return; }
        var timeline = gsap.timeline({ paused: true });

        var FROM = {
          rise: { opacity: 0, y: 36 },
          pop: { opacity: 0, y: 22, scale: 0.92 },
          slide: { opacity: 0, x: -40 },
          fade: { opacity: 0 },
        };
        var EASE = {
          rise: 'power3.out',
          pop: 'back.out(1.5)',
          slide: 'power2.inOut',
          fade: 'power1.out',
        };
        var items = root.querySelectorAll('[data-anim]');
        for (var index = 0; index < items.length; index += 1) {
          var variant = items[index].getAttribute('data-anim');
          timeline.from(
            items[index],
            Object.assign({ duration: 0.65, ease: EASE[variant] || EASE.rise }, FROM[variant] || FROM.rise),
            0.45 + index * 0.24
          );
        }

        var HIGHLIGHTS = {"card-refresh": [[5.13, 7.497]], "card-client": [[10.816, 13.897]], "card-password": [[16.152, 19.051]], "card-device": [[22.945, 23.939]]};
        var OBJECTS = [{"v": "pop", "t": 5.13, "d": 2.367}, {"v": "pop", "t": 10.816, "d": 3.081}, {"v": "pop", "t": 16.152, "d": 2.899}, {"v": "pop", "t": 22.945, "d": 0.994}];
        var MOTIONS = {
          fade: { from: { opacity: 0 }, to: { opacity: 1, ease: 'power1.out' } },
          rise: { from: { opacity: 0, y: 30 }, to: { opacity: 1, y: 0, ease: 'power3.out' } },
          pop: { from: { opacity: 0, scale: 0.82 }, to: { opacity: 1, scale: 1, ease: 'back.out(1.7)' } },
          grow: { from: { opacity: 0, scaleX: 0 }, to: { opacity: 1, scaleX: 1, ease: 'power2.inOut' } },
          bar: { from: { scaleX: 0 }, to: { scaleX: 1, ease: 'expo.out' } },
          slide: { from: { opacity: 0, x: -36 }, to: { opacity: 1, x: 0, ease: 'power2.inOut' } },
          type: { from: { clipPath: 'inset(0% 100% 0% 0%)' }, to: { clipPath: 'inset(0% 0% 0% 0%)', ease: 'none' } },
        };
        var objectEls = root.querySelectorAll('[data-motion]');
        for (var ob = 0; ob < objectEls.length; ob += 1) {
          var spec = OBJECTS[ob] || { v: 'fade', t: 0, d: 0.65 };
          var move = MOTIONS[spec.v] || MOTIONS.fade;
          timeline.fromTo(
            objectEls[ob],
            Object.assign({}, move.from),
            Object.assign({ duration: spec.d, ease: 'power3.out' }, move.to),
            spec.t
          );
        }
        var MSGS = [];
        var msgs = root.querySelectorAll('.seq__msg');
        for (var msg = 0; msg < msgs.length; msg += 1) {
          var span = MSGS[msg] || [0, 0.6];
          timeline.fromTo(
            msgs[msg].querySelector('.seq__line'),
            { scaleX: 0 },
            { scaleX: 1, duration: 0.55, ease: 'power2.inOut' },
            span[0]
          );
          timeline.fromTo(
            msgs[msg].querySelector('.seq__label'),
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: 'power1.out' },
            span[0] + 0.08
          );
          var tip = msgs[msg].querySelector('.seq__tip');
          if (tip) {
            timeline.fromTo(tip, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: 'none' }, span[0] + 0.48);
          }
          var cargo = msgs[msg].querySelectorAll('.seq__token');
          for (var cargoIndex = 0; cargoIndex < cargo.length; cargoIndex += 1) {
            timeline.fromTo(
              cargo[cargoIndex],
              { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.7)' },
              span[0] + 0.62 + cargoIndex * 0.14
            );
          }
        }
        var targets = [];
        Object.keys(HIGHLIGHTS).forEach(function (key) {
          var els = root.querySelectorAll('[data-hl="' + key + '"]');
          for (var hl = 0; hl < els.length; hl += 1) {
            targets.push({ el: els[hl], windows: HIGHLIGHTS[key] });
          }
        });
        var ATTACK = 0.22;
        var RELEASE = 0.55;
        function envelope(time, start, end) {
          if (time < start) { return 0; }
          if (time < end) { return Math.min((time - start) / ATTACK, 1); }
          if (time < end + RELEASE) { return 1 - (time - end) / RELEASE; }
          return 0;
        }
        function paint(target, env) {
          var el = target.el;
          if (env <= 0.001) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
            el.style.textShadow = '';
            return;
          }
          el.style.borderColor =
            'rgb(' + Math.round(58 + 19 * env) + ', ' + Math.round(63 + 145 * env) + ', ' + Math.round(71 + 154 * env) + ')';
          el.style.boxShadow = '0 0 ' + (36 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.28 * env).toFixed(3) + ')';
          el.style.textShadow = '0 0 ' + (16 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.4 * env).toFixed(3) + ')';
        }
        var driver = { t: 0 };
        timeline.to(
          driver,
          {
            t: 27.604,
            duration: 27.604,
            ease: 'none',
            onUpdate: function () {
              for (var i = 0; i < targets.length; i += 1) {
                var env = 0;
                for (var w = 0; w < targets[i].windows.length; w += 1) {
                  env = Math.max(env, envelope(driver.t, targets[i].windows[w][0], targets[i].windows[w][1]));
                }
                paint(targets[i], env);
              }
            },
          },
          0
        );

        window.__timelines['scene-08-grants'] = timeline;
      })();
    </script>
  </div>
</template>
