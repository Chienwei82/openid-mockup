<template>
  <div
    class="scene-root"
    data-composition-id="scene-08-grants"
    data-width="1920"
    data-height="1080"
    data-duration="27.604"
  >
<section class="scene"><header class="scene__head"><span class="kicker" data-anim="pop">Otros caminos</span><h2 class="headline" data-anim="rise">Otros Grants del Token Endpoint</h2></header><p class="mono" data-anim="fade">POST /connect/token — un handler por grant</p><div class="grid grid--2"><article class="card" data-anim="rise"><h3 class="card__title">Con usuario</h3><ul class="list"><li data-hl="card-refresh"><strong>refresh_token</strong> — pide tokens nuevos sin login, rota en cada uso</li><li data-hl="card-password"><strong>password</strong> — valida usuario y contraseña directamente</li></ul></article><article class="card" data-anim="rise"><h3 class="card__title">Sin usuario</h3><ul class="list"><li data-hl="card-client"><strong>client_credentials</strong> — tokens de servicio, sin usuario</li><li data-hl="card-device"><strong>device_code y CIBA</strong> — simulados para completar el discovery</li></ul></article></div></section>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="scene-08-grants"]');
        if (!root || typeof gsap === 'undefined') { return; }
        var timeline = gsap.timeline({ paused: true });

        var FROM = {
          rise: { opacity: 0, y: 36 },
          pop: { opacity: 0, y: 22, scale: 0.92 },
          slide: { opacity: 0, x: -40 },
          fade: { opacity: 0 },
        };
        var items = root.querySelectorAll('[data-anim]');
        for (var index = 0; index < items.length; index += 1) {
          var from = FROM[items[index].getAttribute('data-anim')] || FROM.rise;
          timeline.from(
            items[index],
            Object.assign({ duration: 0.65, ease: 'power3.out' }, from),
            0.45 + index * 0.24
          );
        }

        var HIGHLIGHTS = {"card-refresh": [[5.13, 7.497]], "card-client": [[10.816, 13.897]], "card-password": [[16.152, 19.051]], "card-device": [[22.945, 23.939]]};
        var targets = [];
        Object.keys(HIGHLIGHTS).forEach(function (key) {
          var el = root.querySelector('[data-hl="' + key + '"]');
          if (el) { targets.push({ el: el, windows: HIGHLIGHTS[key] }); }
        });
        var ATTACK = 0.22;
        var RELEASE = 0.55;
        function envelope(time, start, end) {
          if (time < start) { return 0; }
          if (time < end) { return Math.min((time - start) / ATTACK, 1); }
          if (time < end + RELEASE) { return 1 - (time - end) / RELEASE; }
          return 0;
        }
        function paint(target, env) {
          var el = target.el;
          if (env <= 0.001) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
            el.style.textShadow = '';
            return;
          }
          el.style.borderColor =
            'rgb(' + Math.round(58 + 19 * env) + ', ' + Math.round(63 + 145 * env) + ', ' + Math.round(71 + 154 * env) + ')';
          el.style.boxShadow = '0 0 ' + (36 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.28 * env).toFixed(3) + ')';
          el.style.textShadow = '0 0 ' + (16 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.4 * env).toFixed(3) + ')';
        }
        var driver = { t: 0 };
        timeline.to(
          driver,
          {
            t: 27.604,
            duration: 27.604,
            ease: 'none',
            onUpdate: function () {
              for (var i = 0; i < targets.length; i += 1) {
                var env = 0;
                for (var w = 0; w < targets[i].windows.length; w += 1) {
                  env = Math.max(env, envelope(driver.t, targets[i].windows[w][0], targets[i].windows[w][1]));
                }
                paint(targets[i], env);
              }
            },
          },
          0
        );

        window.__timelines['scene-08-grants'] = timeline;
      })();
    </script>
  </div>
</template>
