<template>
  <div
    class="scene-root"
    data-composition-id="scene-10-sesion"
    data-width="1920"
    data-height="1080"
    data-duration="24.748"
  >
<section class="scene"><header class="scene__head"><span class="kicker" data-anim="pop">Sesión</span><h2 class="headline" data-anim="rise">Sesión y Logout</h2></header><div class="grid grid--3"><article class="card" data-anim="rise" data-hl="card-op"><h3 class="card__title">Sesión del OP</h3><ul class="list"><li>Habilita el SSO</li><li>Cookie del navegador</li><li>Vida por defecto 8 h</li></ul></article><article class="card" data-anim="rise" data-hl="card-cliente"><h3 class="card__title">Sesión del cliente</h3><ul class="list"><li>Cookie propia de la aplicación</li><li>Independiente del OP</li><li>Se cierra con el logout</li></ul></article><article class="card" data-anim="rise" data-hl="card-sid"><h3 class="card__title">sid</h3><ul class="list"><li>Conecta el id_token con la sesión</li><li>Viaja también en el logout</li><li>Permite front-channel logout</li></ul></article></div><div class="grid grid--2 grid--tight"><article class="card" data-anim="rise" data-hl="card-prompt"><h3 class="card__title">prompt</h3><div class="chiprow" data-anim="fade"><span class="chip">none</span><span class="chip">login</span><span class="chip">consent</span><span class="chip">select_account</span></div></article><article class="card" data-anim="rise" data-hl="card-logout"><h3 class="card__title">RP-Initiated Logout</h3><p class="mono">/connect/endsession · id_token_hint · post_logout_redirect_uri</p></article></div></section>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="scene-10-sesion"]');
        if (!root || typeof gsap === 'undefined') { return; }
        var timeline = gsap.timeline({ paused: true });

        var FROM = {
          rise: { opacity: 0, y: 36 },
          pop: { opacity: 0, y: 22, scale: 0.92 },
          slide: { opacity: 0, x: -40 },
          fade: { opacity: 0 },
        };
        var items = root.querySelectorAll('[data-anim]');
        for (var index = 0; index < items.length; index += 1) {
          var from = FROM[items[index].getAttribute('data-anim')] || FROM.rise;
          timeline.from(
            items[index],
            Object.assign({ duration: 0.65, ease: 'power3.out' }, from),
            0.45 + index * 0.24
          );
        }

        var HIGHLIGHTS = {"card-op": [[2.491, 3.233]], "card-cliente": [[5.614, 6.426]], "card-sid": [[8.345, 8.849]], "card-logout": [[12.959, 13.799]], "card-prompt": [[18.883, 19.808]]};
        var targets = [];
        Object.keys(HIGHLIGHTS).forEach(function (key) {
          var el = root.querySelector('[data-hl="' + key + '"]');
          if (el) { targets.push({ el: el, windows: HIGHLIGHTS[key] }); }
        });
        var ATTACK = 0.22;
        var RELEASE = 0.55;
        function envelope(time, start, end) {
          if (time < start) { return 0; }
          if (time < end) { return Math.min((time - start) / ATTACK, 1); }
          if (time < end + RELEASE) { return 1 - (time - end) / RELEASE; }
          return 0;
        }
        function paint(target, env) {
          var el = target.el;
          if (env <= 0.001) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
            el.style.textShadow = '';
            return;
          }
          el.style.borderColor =
            'rgb(' + Math.round(58 + 19 * env) + ', ' + Math.round(63 + 145 * env) + ', ' + Math.round(71 + 154 * env) + ')';
          el.style.boxShadow = '0 0 ' + (36 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.28 * env).toFixed(3) + ')';
          el.style.textShadow = '0 0 ' + (16 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.4 * env).toFixed(3) + ')';
        }
        var driver = { t: 0 };
        timeline.to(
          driver,
          {
            t: 24.748,
            duration: 24.748,
            ease: 'none',
            onUpdate: function () {
              for (var i = 0; i < targets.length; i += 1) {
                var env = 0;
                for (var w = 0; w < targets[i].windows.length; w += 1) {
                  env = Math.max(env, envelope(driver.t, targets[i].windows[w][0], targets[i].windows[w][1]));
                }
                paint(targets[i], env);
              }
            },
          },
          0
        );

        window.__timelines['scene-10-sesion'] = timeline;
      })();
    </script>
  </div>
</template>
