<template>
  <div
    class="scene-root"
    data-composition-id="scene-10-sesion"
    data-width="1920"
    data-height="1080"
    data-duration="24.748"
  >
<section class="scene"><header class="scene__head"><span class="kicker" data-anim="pop">Sesión</span><h2 class="headline" data-anim="rise">Tres Sesiones y el Logout</h2></header><div class="sess"><div class="sess__lane" data-motion="fade"><div class="sess__who" data-hl="card-op"><p class="sess__name">Sesión del OP</p><p class="sess__note">habilita el SSO</p></div><div class="sess__track"><div class="sess__bar sess__bar--op" data-motion="bar" data-hl="card-op"></div><div class="sess__cut" data-motion="pop" data-hl="card-logout"><span class="badge badge--warn">end_session</span></div></div></div><div class="sess__lane" data-motion="fade"><div class="sess__who" data-hl="card-cliente"><p class="sess__name">Sesión del cliente</p><p class="sess__note">su propia cookie</p></div><div class="sess__track"><div class="sess__bar sess__bar--cliente" data-motion="bar" data-hl="card-cliente"></div></div></div><div class="sess__lane" data-motion="fade"><div class="sess__who" data-hl="card-sid"><p class="sess__name">sid</p><p class="sess__note">puente entre id_token y la sesión del OP</p></div><div class="sess__track"><div class="sess__bar sess__bar--sid" data-motion="bar" data-hl="card-sid"></div><div class="sess__cut" data-motion="pop" data-hl="card-logout"><span class="badge badge--warn">sid caduca</span></div></div></div><p class="note" data-motion="fade" data-hl="card-logout">logout: <code>connect/end_session</code> con <code>id_token_hint</code> y <code>post_logout_redirect_uri</code></p><div class="chiprow sess__chips" data-motion="fade" data-hl="card-prompt"><span class="chip">prompt=none</span><span class="chip">prompt=login</span><span class="chip">prompt=consent</span><span class="chip">prompt=select_account</span></div></div></section>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="scene-10-sesion"]');
        if (!root || typeof gsap === 'undefined') { return; }
        var timeline = gsap.timeline({ paused: true });

        var FROM = {
          rise: { opacity: 0, y: 36 },
          pop: { opacity: 0, y: 22, scale: 0.92 },
          slide: { opacity: 0, x: -40 },
          fade: { opacity: 0 },
        };
        var items = root.querySelectorAll('[data-anim]');
        for (var index = 0; index < items.length; index += 1) {
          var from = FROM[items[index].getAttribute('data-anim')] || FROM.rise;
          timeline.from(
            items[index],
            Object.assign({ duration: 0.65, ease: 'power3.out' }, from),
            0.45 + index * 0.24
          );
        }

        var HIGHLIGHTS = {"card-op": [[2.491, 3.233]], "card-cliente": [[5.614, 6.426]], "card-sid": [[8.345, 8.849]], "card-logout": [[12.959, 13.799]], "card-prompt": [[18.883, 19.808]]};
        var OBJECTS = [{"v": "fade", "t": 1.1, "d": 0.45}, {"v": "bar", "t": 2.491, "d": 0.742}, {"v": "pop", "t": 12.959, "d": 0.84}, {"v": "fade", "t": 1.45, "d": 0.45}, {"v": "bar", "t": 5.614, "d": 0.812}, {"v": "fade", "t": 1.8, "d": 0.45}, {"v": "bar", "t": 8.345, "d": 0.504}, {"v": "pop", "t": 13.859, "d": 0.84}, {"v": "fade", "t": 14.759, "d": 0.84}, {"v": "fade", "t": 18.883, "d": 0.925}];
        var MOTIONS = {
          fade: { from: { opacity: 0 }, to: { opacity: 1 } },
          rise: { from: { opacity: 0, y: 30 }, to: { opacity: 1, y: 0 } },
          pop: { from: { opacity: 0, scale: 0.82 }, to: { opacity: 1, scale: 1, ease: 'back.out(1.6)' } },
          grow: { from: { opacity: 0, scaleX: 0 }, to: { opacity: 1, scaleX: 1 } },
          bar: { from: { scaleX: 0 }, to: { scaleX: 1, ease: 'power2.out' } },
          slide: { from: { opacity: 0, x: -36 }, to: { opacity: 1, x: 0 } },
        };
        var objectEls = root.querySelectorAll('[data-motion]');
        for (var ob = 0; ob < objectEls.length; ob += 1) {
          var spec = OBJECTS[ob] || { v: 'fade', t: 0, d: 0.65 };
          var move = MOTIONS[spec.v] || MOTIONS.fade;
          timeline.fromTo(
            objectEls[ob],
            Object.assign({}, move.from),
            Object.assign({ duration: spec.d, ease: 'power3.out' }, move.to),
            spec.t
          );
        }
        var MSGS = [];
        var msgs = root.querySelectorAll('.seq__msg');
        for (var msg = 0; msg < msgs.length; msg += 1) {
          var span = MSGS[msg] || [0, 0.6];
          timeline.fromTo(
            msgs[msg].querySelector('.seq__line'),
            { scaleX: 0 },
            { scaleX: 1, duration: 0.55, ease: 'power2.inOut' },
            span[0]
          );
          timeline.fromTo(
            msgs[msg].querySelector('.seq__label'),
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: 'power1.out' },
            span[0] + 0.08
          );
          var tip = msgs[msg].querySelector('.seq__tip');
          if (tip) {
            timeline.fromTo(tip, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: 'none' }, span[0] + 0.48);
          }
          var cargo = msgs[msg].querySelectorAll('.seq__token');
          for (var cargoIndex = 0; cargoIndex < cargo.length; cargoIndex += 1) {
            timeline.fromTo(
              cargo[cargoIndex],
              { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.7)' },
              span[0] + 0.62 + cargoIndex * 0.14
            );
          }
        }
        var targets = [];
        Object.keys(HIGHLIGHTS).forEach(function (key) {
          var els = root.querySelectorAll('[data-hl="' + key + '"]');
          for (var hl = 0; hl < els.length; hl += 1) {
            targets.push({ el: els[hl], windows: HIGHLIGHTS[key] });
          }
        });
        var ATTACK = 0.22;
        var RELEASE = 0.55;
        function envelope(time, start, end) {
          if (time < start) { return 0; }
          if (time < end) { return Math.min((time - start) / ATTACK, 1); }
          if (time < end + RELEASE) { return 1 - (time - end) / RELEASE; }
          return 0;
        }
        function paint(target, env) {
          var el = target.el;
          if (env <= 0.001) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
            el.style.textShadow = '';
            return;
          }
          el.style.borderColor =
            'rgb(' + Math.round(58 + 19 * env) + ', ' + Math.round(63 + 145 * env) + ', ' + Math.round(71 + 154 * env) + ')';
          el.style.boxShadow = '0 0 ' + (36 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.28 * env).toFixed(3) + ')';
          el.style.textShadow = '0 0 ' + (16 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.4 * env).toFixed(3) + ')';
        }
        var driver = { t: 0 };
        timeline.to(
          driver,
          {
            t: 24.748,
            duration: 24.748,
            ease: 'none',
            onUpdate: function () {
              for (var i = 0; i < targets.length; i += 1) {
                var env = 0;
                for (var w = 0; w < targets[i].windows.length; w += 1) {
                  env = Math.max(env, envelope(driver.t, targets[i].windows[w][0], targets[i].windows[w][1]));
                }
                paint(targets[i], env);
              }
            },
          },
          0
        );

        window.__timelines['scene-10-sesion'] = timeline;
      })();
    </script>
  </div>
</template>
