<template>
  <div
    class="scene-root"
    data-composition-id="scene-11-avanzados"
    data-width="1920"
    data-height="1080"
    data-duration="16.564"
  >
<section class="scene"><header class="scene__head"><span class="kicker" data-anim="pop">Avanzado</span><h2 class="headline" data-anim="rise">Flujos Avanzados</h2></header><div class="grid grid--3"><article class="card" data-anim="rise" data-hl="card-par"><h3 class="card__title">PAR <span class="badge badge--ok">implementado</span></h3><ul class="list"><li>RFC 9126, un solo uso</li><li>Envía los parámetros por back-channel</li><li>Devuelve <code>request_uri</code> al cliente</li></ul></article><article class="card" data-anim="rise" data-hl="card-hibrido"><h3 class="card__title">Híbrido <span class="badge badge--ok">implementado</span></h3><ul class="list"><li><code>code id_token</code> en el fragmento</li><li>Incluye <code>c_hash</code> y <code>session_state</code></li><li>Pensado para el sistema interno</li></ul></article><article class="card" data-anim="rise" data-hl="card-device"><h3 class="card__title">Device y CIBA <span class="badge badge--warn">simulados</span></h3><ul class="list"><li>Ciclo de sondeo, sin pantalla ni push</li><li><code>authorization_pending</code>, <code>slow_down</code></li><li>Validan el discovery anunciado</li></ul></article></div><p class="note" data-anim="fade">Implicit (<code>id_token token</code>) se anuncia pero no se responde: devuelve <code>unsupported_response_type</code>.</p></section>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="scene-11-avanzados"]');
        if (!root || typeof gsap === 'undefined') { return; }
        var timeline = gsap.timeline({ paused: true });

        var FROM = {
          rise: { opacity: 0, y: 36 },
          pop: { opacity: 0, y: 22, scale: 0.92 },
          slide: { opacity: 0, x: -40 },
          fade: { opacity: 0 },
        };
        var items = root.querySelectorAll('[data-anim]');
        for (var index = 0; index < items.length; index += 1) {
          var from = FROM[items[index].getAttribute('data-anim')] || FROM.rise;
          timeline.from(
            items[index],
            Object.assign({ duration: 0.65, ease: 'power3.out' }, from),
            0.45 + index * 0.24
          );
        }

        var HIGHLIGHTS = {"card-par": [[1.454, 2.393], [10.536, 11.74]], "card-hibrido": [[2.855, 3.751]], "card-device": [[6.272, 7.869]]};
        var targets = [];
        Object.keys(HIGHLIGHTS).forEach(function (key) {
          var el = root.querySelector('[data-hl="' + key + '"]');
          if (el) { targets.push({ el: el, windows: HIGHLIGHTS[key] }); }
        });
        var ATTACK = 0.22;
        var RELEASE = 0.55;
        function envelope(time, start, end) {
          if (time < start) { return 0; }
          if (time < end) { return Math.min((time - start) / ATTACK, 1); }
          if (time < end + RELEASE) { return 1 - (time - end) / RELEASE; }
          return 0;
        }
        function paint(target, env) {
          var el = target.el;
          if (env <= 0.001) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
            el.style.textShadow = '';
            return;
          }
          el.style.borderColor =
            'rgb(' + Math.round(58 + 19 * env) + ', ' + Math.round(63 + 145 * env) + ', ' + Math.round(71 + 154 * env) + ')';
          el.style.boxShadow = '0 0 ' + (36 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.28 * env).toFixed(3) + ')';
          el.style.textShadow = '0 0 ' + (16 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.4 * env).toFixed(3) + ')';
        }
        var driver = { t: 0 };
        timeline.to(
          driver,
          {
            t: 16.564,
            duration: 16.564,
            ease: 'none',
            onUpdate: function () {
              for (var i = 0; i < targets.length; i += 1) {
                var env = 0;
                for (var w = 0; w < targets[i].windows.length; w += 1) {
                  env = Math.max(env, envelope(driver.t, targets[i].windows[w][0], targets[i].windows[w][1]));
                }
                paint(targets[i], env);
              }
            },
          },
          0
        );

        window.__timelines['scene-11-avanzados'] = timeline;
      })();
    </script>
  </div>
</template>
