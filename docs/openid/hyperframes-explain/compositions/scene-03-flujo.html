<template>
  <div
    class="scene-root"
    data-composition-id="scene-03-flujo"
    data-width="1920"
    data-height="1080"
    data-duration="31.492"
  >
<section class="scene"><header class="scene__head"><span class="kicker" data-anim="pop">El mapa</span><h2 class="headline" data-anim="rise">El Flujo Completo, en Seis Pasos</h2></header><div class="chiprow" data-anim="fade"><span class="chip">Cliente</span><span class="chip">Navegador</span><span class="chip">OP · OidcMock</span><span class="chip">API</span></div><ol class="flow" data-anim="fade"><span class="flow__rail" aria-hidden="true"></span><li class="flow__stop" data-anim="pop" data-hl="flujo-discovery"><span class="flow__n">1</span><span class="flow__label">El cliente descubre los endpoints</span><span class="flow__token" data-token="flujo-discovery" aria-hidden="true"></span></li><li class="flow__stop" data-anim="pop" data-hl="flujo-authorize"><span class="flow__n">2</span><span class="flow__label">Redirige al navegador al authorize</span><span class="flow__token" data-token="flujo-authorize" aria-hidden="true"></span></li><li class="flow__stop" data-anim="pop" data-hl="flujo-aprueba"><span class="flow__n">3</span><span class="flow__label">El usuario aprueba y vuelve con el código</span><span class="flow__token" data-token="flujo-aprueba" aria-hidden="true"></span></li><li class="flow__stop" data-anim="pop" data-hl="flujo-canje"><span class="flow__n">4</span><span class="flow__label">El cliente canjea el código por tokens</span><span class="flow__token" data-token="flujo-canje" aria-hidden="true"></span></li><li class="flow__stop" data-anim="pop" data-hl="flujo-userinfo"><span class="flow__n">5</span><span class="flow__label">Lee la identidad en userinfo</span><span class="flow__token" data-token="flujo-userinfo" aria-hidden="true"></span></li><li class="flow__stop" data-anim="pop" data-hl="flujo-api"><span class="flow__n">6</span><span class="flow__label">Llama a la API con el access token</span><span class="flow__token" data-token="flujo-api" aria-hidden="true"></span></li></ol><p class="note" data-anim="fade">Memoriza este mapa: cada escena siguiente amplía una de sus paradas.</p></section>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="scene-03-flujo"]');
        if (!root || typeof gsap === 'undefined') { return; }
        var timeline = gsap.timeline({ paused: true });

        var FROM = {
          rise: { opacity: 0, y: 36 },
          pop: { opacity: 0, y: 22, scale: 0.92 },
          slide: { opacity: 0, x: -40 },
          fade: { opacity: 0 },
        };
        var items = root.querySelectorAll('[data-anim]');
        for (var index = 0; index < items.length; index += 1) {
          var from = FROM[items[index].getAttribute('data-anim')] || FROM.rise;
          timeline.from(
            items[index],
            Object.assign({ duration: 0.65, ease: 'power3.out' }, from),
            0.45 + index * 0.24
          );
        }

        var HIGHLIGHTS = {"flujo-discovery": [[6.474, 8.071]], "flujo-authorize": [[10.032, 12.441]], "flujo-aprueba": [[14.345, 17.006]], "flujo-canje": [[19.443, 21.544]], "flujo-userinfo": [[23.295, 25.228]], "flujo-api": [[27.16, 29.513]]};
        var RAILS = [[6.474, 29.513]];
        var TOKENS = [[6.474, 8.071], [10.032, 12.441], [14.345, 17.006], [19.443, 21.544], [23.295, 25.228], [27.16, 29.513]];
        var rails = root.querySelectorAll('.flow__rail');
        for (var rail = 0; rail < rails.length; rail += 1) {
          var span = RAILS[rail] || [0, 0.6];
          timeline.fromTo(
            rails[rail],
            { scaleY: 0 },
            { scaleY: 1, duration: Math.max(span[1] - span[0], 0.4), ease: 'power2.out' },
            span[0]
          );
        }
        var tokens = root.querySelectorAll('.flow__token');
        for (var tok = 0; tok < tokens.length; tok += 1) {
          var win = TOKENS[tok] || [0, 0];
          timeline.fromTo(
            tokens[tok],
            { opacity: 0, scale: 0 },
            { opacity: 1, scale: 1, duration: 0.35, ease: 'power3.out' },
            Math.max(win[0] - 0.15, 0)
          );
          timeline.to(tokens[tok], { opacity: 0.25, duration: 0.5, ease: 'power1.out' }, win[1]);
        }
        var targets = [];
        Object.keys(HIGHLIGHTS).forEach(function (key) {
          var el = root.querySelector('[data-hl="' + key + '"]');
          if (el) { targets.push({ el: el, windows: HIGHLIGHTS[key] }); }
        });
        var ATTACK = 0.22;
        var RELEASE = 0.55;
        function envelope(time, start, end) {
          if (time < start) { return 0; }
          if (time < end) { return Math.min((time - start) / ATTACK, 1); }
          if (time < end + RELEASE) { return 1 - (time - end) / RELEASE; }
          return 0;
        }
        function paint(target, env) {
          var el = target.el;
          if (env <= 0.001) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
            el.style.textShadow = '';
            return;
          }
          el.style.borderColor =
            'rgb(' + Math.round(58 + 19 * env) + ', ' + Math.round(63 + 145 * env) + ', ' + Math.round(71 + 154 * env) + ')';
          el.style.boxShadow = '0 0 ' + (36 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.28 * env).toFixed(3) + ')';
          el.style.textShadow = '0 0 ' + (16 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.4 * env).toFixed(3) + ')';
        }
        var driver = { t: 0 };
        timeline.to(
          driver,
          {
            t: 31.492,
            duration: 31.492,
            ease: 'none',
            onUpdate: function () {
              for (var i = 0; i < targets.length; i += 1) {
                var env = 0;
                for (var w = 0; w < targets[i].windows.length; w += 1) {
                  env = Math.max(env, envelope(driver.t, targets[i].windows[w][0], targets[i].windows[w][1]));
                }
                paint(targets[i], env);
              }
            },
          },
          0
        );

        window.__timelines['scene-03-flujo'] = timeline;
      })();
    </script>
  </div>
</template>
