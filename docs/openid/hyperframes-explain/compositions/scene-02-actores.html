<template>
  <div
    class="scene-root"
    data-composition-id="scene-02-actores"
    data-width="1920"
    data-height="1080"
    data-duration="25.108"
  >
<section class="scene"><header class="scene__head"><span class="kicker" data-anim="pop">Actores</span><h2 class="headline" data-anim="rise">Actores y Tokens</h2></header><div class="roles"><article class="role" data-anim="pop" style="--actor: var(--actor-owner)" data-hl="role-owner"><span class="role__icon"><svg class="actor__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5c.6-3.4 3.3-5 6.5-5s5.9 1.6 6.5 5"/></svg></span><h3 class="role__name">Resource Owner</h3><p class="role__note">el usuario, dueño de sus datos</p></article><article class="role" data-anim="pop" style="--actor: var(--actor-client)" data-hl="role-client"><span class="role__icon"><svg class="actor__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="5.5" width="15" height="13" rx="2.2"/><path d="M4.5 9.5h15"/><circle cx="7.6" cy="7.5" r=".9"/></svg></span><h3 class="role__name">Client</h3><p class="role__note">la aplicación que pide acceso</p></article><article class="role" data-anim="pop" style="--actor: var(--actor-op)" data-hl="role-as"><span class="role__icon"><svg class="actor__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="3.2"/><path d="M12.2 12H20"/><path d="M17 12v3.2"/><path d="M14.4 12v2.2"/></svg></span><h3 class="role__name">Authorization Server</h3><p class="role__note">OidcMock emite los tokens</p></article><article class="role" data-anim="pop" style="--actor: var(--actor-api)" data-hl="role-rs"><span class="role__icon"><svg class="actor__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="5" width="15" height="5.6" rx="1.6"/><rect x="4.5" y="13.4" width="15" height="5.6" rx="1.6"/><path d="M8 7.8h.01M8 16.2h.01"/></svg></span><h3 class="role__name">Resource Server</h3><p class="role__note">la API protegida por tokens</p></article></div><div class="grid"><article class="card" data-anim="rise"><h3 class="card__title">Cuatro tokens</h3><ul class="list"><li data-hl="tok-code"><span class="tok tok--code">code</span> Authorization Code — opaco, un solo uso</li><li data-hl="tok-access"><span class="tok tok--access">access</span> Access Token — JWT para la API</li><li data-hl="tok-id"><span class="tok tok--id">id</span> ID Token — JWT de identidad</li><li data-hl="tok-refresh"><span class="tok tok--refresh">refresh</span> Refresh Token — vida larga</li></ul></article></div></section>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="scene-02-actores"]');
        if (!root || typeof gsap === 'undefined') { return; }
        var timeline = gsap.timeline({ paused: true });

        var FROM = {
          rise: { opacity: 0, y: 36 },
          pop: { opacity: 0, y: 22, scale: 0.92 },
          slide: { opacity: 0, x: -40 },
          fade: { opacity: 0 },
        };
        var items = root.querySelectorAll('[data-anim]');
        for (var index = 0; index < items.length; index += 1) {
          var from = FROM[items[index].getAttribute('data-anim')] || FROM.rise;
          timeline.from(
            items[index],
            Object.assign({ duration: 0.65, ease: 'power3.out' }, from),
            0.45 + index * 0.24
          );
        }

        var HIGHLIGHTS = {"role-owner": [[4.045, 4.914]], "role-client": [[6.874, 7.337]], "role-as": [[9.395, 10.6]], "role-rs": [[12.897, 13.765]], "tok-code": [[18.673, 19.836]], "tok-access": [[20.102, 20.984]], "tok-id": [[21.32, 22.076]], "tok-refresh": [[22.174, 23.127]]};
        var OBJECTS = [];
        var MOTIONS = {
          fade: { from: { opacity: 0 }, to: { opacity: 1 } },
          rise: { from: { opacity: 0, y: 30 }, to: { opacity: 1, y: 0 } },
          pop: { from: { opacity: 0, scale: 0.82 }, to: { opacity: 1, scale: 1, ease: 'back.out(1.6)' } },
          grow: { from: { opacity: 0, scaleX: 0 }, to: { opacity: 1, scaleX: 1 } },
          bar: { from: { scaleX: 0 }, to: { scaleX: 1, ease: 'power2.out' } },
          slide: { from: { opacity: 0, x: -36 }, to: { opacity: 1, x: 0 } },
        };
        var objectEls = root.querySelectorAll('[data-motion]');
        for (var ob = 0; ob < objectEls.length; ob += 1) {
          var spec = OBJECTS[ob] || { v: 'fade', t: 0, d: 0.65 };
          var move = MOTIONS[spec.v] || MOTIONS.fade;
          timeline.fromTo(
            objectEls[ob],
            Object.assign({}, move.from),
            Object.assign({ duration: spec.d, ease: 'power3.out' }, move.to),
            spec.t
          );
        }
        var MSGS = [];
        var msgs = root.querySelectorAll('.seq__msg');
        for (var msg = 0; msg < msgs.length; msg += 1) {
          var span = MSGS[msg] || [0, 0.6];
          timeline.fromTo(
            msgs[msg].querySelector('.seq__line'),
            { scaleX: 0 },
            { scaleX: 1, duration: 0.55, ease: 'power2.inOut' },
            span[0]
          );
          timeline.fromTo(
            msgs[msg].querySelector('.seq__label'),
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: 'power1.out' },
            span[0] + 0.08
          );
          var tip = msgs[msg].querySelector('.seq__tip');
          if (tip) {
            timeline.fromTo(tip, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: 'none' }, span[0] + 0.48);
          }
          var cargo = msgs[msg].querySelectorAll('.seq__token');
          for (var cargoIndex = 0; cargoIndex < cargo.length; cargoIndex += 1) {
            timeline.fromTo(
              cargo[cargoIndex],
              { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.7)' },
              span[0] + 0.62 + cargoIndex * 0.14
            );
          }
        }
        var targets = [];
        Object.keys(HIGHLIGHTS).forEach(function (key) {
          var els = root.querySelectorAll('[data-hl="' + key + '"]');
          for (var hl = 0; hl < els.length; hl += 1) {
            targets.push({ el: els[hl], windows: HIGHLIGHTS[key] });
          }
        });
        var ATTACK = 0.22;
        var RELEASE = 0.55;
        function envelope(time, start, end) {
          if (time < start) { return 0; }
          if (time < end) { return Math.min((time - start) / ATTACK, 1); }
          if (time < end + RELEASE) { return 1 - (time - end) / RELEASE; }
          return 0;
        }
        function paint(target, env) {
          var el = target.el;
          if (env <= 0.001) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
            el.style.textShadow = '';
            return;
          }
          el.style.borderColor =
            'rgb(' + Math.round(58 + 19 * env) + ', ' + Math.round(63 + 145 * env) + ', ' + Math.round(71 + 154 * env) + ')';
          el.style.boxShadow = '0 0 ' + (36 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.28 * env).toFixed(3) + ')';
          el.style.textShadow = '0 0 ' + (16 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.4 * env).toFixed(3) + ')';
        }
        var driver = { t: 0 };
        timeline.to(
          driver,
          {
            t: 25.108,
            duration: 25.108,
            ease: 'none',
            onUpdate: function () {
              for (var i = 0; i < targets.length; i += 1) {
                var env = 0;
                for (var w = 0; w < targets[i].windows.length; w += 1) {
                  env = Math.max(env, envelope(driver.t, targets[i].windows[w][0], targets[i].windows[w][1]));
                }
                paint(targets[i], env);
              }
            },
          },
          0
        );

        window.__timelines['scene-02-actores'] = timeline;
      })();
    </script>
  </div>
</template>
