<template>
  <div
    class="scene-root"
    data-composition-id="scene-02-actores"
    data-width="1920"
    data-height="1080"
    data-duration="25.108"
  >
<section class="scene"><header class="scene__head"><span class="kicker" data-anim="pop">Actores</span><h2 class="headline" data-anim="rise">Actores y Tokens</h2></header><div class="grid grid--2"><article class="card" data-anim="rise"><h3 class="card__title">Cuatro roles (OAuth 2.0)</h3><ul class="list"><li data-hl="role-owner"><strong>Resource Owner</strong> — el usuario</li><li data-hl="role-client"><strong>Client</strong> — la aplicación</li><li data-hl="role-as"><strong>Authorization Server</strong> — emite los tokens</li><li data-hl="role-rs"><strong>Resource Server</strong> — sirve la API protegida</li></ul></article><article class="card" data-anim="rise"><h3 class="card__title">Cuatro tokens</h3><ul class="list"><li data-hl="tok-code"><span class="tok tok--code">code</span> Authorization Code — opaco, un solo uso</li><li data-hl="tok-access"><span class="tok tok--access">access</span> Access Token — JWT para la API</li><li data-hl="tok-id"><span class="tok tok--id">id</span> ID Token — JWT de identidad</li><li data-hl="tok-refresh"><span class="tok tok--refresh">refresh</span> Refresh Token — vida larga</li></ul></article></div></section>

    <script>
      (function () {
        var root = document.querySelector('[data-composition-id="scene-02-actores"]');
        if (!root || typeof gsap === 'undefined') { return; }
        var timeline = gsap.timeline({ paused: true });

        var FROM = {
          rise: { opacity: 0, y: 36 },
          pop: { opacity: 0, y: 22, scale: 0.92 },
          slide: { opacity: 0, x: -40 },
          fade: { opacity: 0 },
        };
        var items = root.querySelectorAll('[data-anim]');
        for (var index = 0; index < items.length; index += 1) {
          var from = FROM[items[index].getAttribute('data-anim')] || FROM.rise;
          timeline.from(
            items[index],
            Object.assign({ duration: 0.65, ease: 'power3.out' }, from),
            0.45 + index * 0.24
          );
        }

        var HIGHLIGHTS = {"role-owner": [[4.045, 4.914]], "role-client": [[6.874, 7.337]], "role-as": [[9.395, 10.6]], "role-rs": [[12.897, 13.765]], "tok-code": [[18.673, 19.836]], "tok-access": [[20.102, 20.984]], "tok-id": [[21.32, 22.076]], "tok-refresh": [[22.174, 23.127]]};
        var targets = [];
        Object.keys(HIGHLIGHTS).forEach(function (key) {
          var el = root.querySelector('[data-hl="' + key + '"]');
          if (el) { targets.push({ el: el, windows: HIGHLIGHTS[key] }); }
        });
        var ATTACK = 0.22;
        var RELEASE = 0.55;
        function envelope(time, start, end) {
          if (time < start) { return 0; }
          if (time < end) { return Math.min((time - start) / ATTACK, 1); }
          if (time < end + RELEASE) { return 1 - (time - end) / RELEASE; }
          return 0;
        }
        function paint(target, env) {
          var el = target.el;
          if (env <= 0.001) {
            el.style.borderColor = '';
            el.style.boxShadow = '';
            el.style.textShadow = '';
            return;
          }
          el.style.borderColor =
            'rgb(' + Math.round(58 + 19 * env) + ', ' + Math.round(63 + 145 * env) + ', ' + Math.round(71 + 154 * env) + ')';
          el.style.boxShadow = '0 0 ' + (36 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.28 * env).toFixed(3) + ')';
          el.style.textShadow = '0 0 ' + (16 * env).toFixed(1) + 'px rgba(77, 208, 225, ' + (0.4 * env).toFixed(3) + ')';
        }
        var driver = { t: 0 };
        timeline.to(
          driver,
          {
            t: 25.108,
            duration: 25.108,
            ease: 'none',
            onUpdate: function () {
              for (var i = 0; i < targets.length; i += 1) {
                var env = 0;
                for (var w = 0; w < targets[i].windows.length; w += 1) {
                  env = Math.max(env, envelope(driver.t, targets[i].windows[w][0], targets[i].windows[w][1]));
                }
                paint(targets[i], env);
              }
            },
          },
          0
        );

        window.__timelines['scene-02-actores'] = timeline;
      })();
    </script>
  </div>
</template>
