<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>OpenID Connect Explicado — OidcMock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
:root {
  --primary: #4DD0E1;
  --on-primary: #00363A;
  --secondary: #80CBC4;
  --tertiary: #80CBF4;
  --success: #81C784;
  --warn: #FFD54F;
  --error: #FFB4AB;
  --surface: #0E1015;
  --surface-1: #15181D;
  --surface-2: #1D2024;
  --surface-3: #282A2E;
  --on-surface: #E6E8EE;
  --on-surface-dim: #A9AEB8;
  --outline: #3A3F47;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 20px;
  --r-full: 9999px;
  --pad: 84px;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--surface);
  color: var(--on-surface);
  font-family: Inter, "Segoe UI", system-ui, sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

#root { position: relative; width: 100%; height: 100%; overflow: hidden; }

/* Fondo persistente: rejilla tenue + dos halos tonales */
.hf-backdrop { position: absolute; inset: 0; overflow: hidden; }
.hf-backdrop__grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(141, 145, 153, .07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(141, 145, 153, .07) 1px, transparent 1px);
  background-size: 96px 96px;
}
.hf-backdrop__glow { position: absolute; border-radius: 50%; filter: blur(120px); opacity: .32; }
.hf-backdrop__glow--primary { width: 1100px; height: 1100px; top: -420px; left: -260px; background: #0E6B75; }
.hf-backdrop__glow--tertiary { width: 900px; height: 900px; bottom: -420px; right: -220px; background: #12405C; }

/* Barra superior persistente */
.hf-brandbar {
  position: absolute; top: 52px; left: var(--pad); right: var(--pad);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 20px; letter-spacing: 2.4px; text-transform: uppercase;
  color: var(--on-surface-dim);
}
.hf-brandbar__mark { display: flex; align-items: center; gap: 16px; color: var(--on-surface); }
.hf-brandbar__dot { width: 14px; height: 14px; border-radius: 50%; background: var(--primary); }
.hf-brandbar__tag { color: var(--primary); }

/* Riel de progreso persistente */
.hf-rail {
  position: absolute; left: var(--pad); right: var(--pad); bottom: 54px; height: 6px;
  background: rgba(226, 232, 238, .1); border-radius: var(--r-full);
}
.hf-rail__fill {
  height: 100%; width: 100%; border-radius: var(--r-full);
  transform-origin: left center;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
}
.hf-rail__label {
  position: absolute; left: var(--pad); bottom: 78px;
  font-size: 17px; letter-spacing: 2px; text-transform: uppercase; color: var(--on-surface-dim);
}

/* Escenas */
.scene-root { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; justify-content: center;
  padding: 200px var(--pad) 170px;
}
.scene--center { align-items: center; text-align: center; }
.scene__head { margin-bottom: 44px; }

.kicker {
  display: block; width: fit-content;
  padding: 9px 22px; margin-bottom: 26px; border-radius: var(--r-full);
  background: rgba(77, 208, 225, .13); color: var(--primary);
  font-size: 19px; font-weight: 600; letter-spacing: 2.6px; text-transform: uppercase;
}
.scene--center .kicker { margin-inline: auto; }

.headline { margin: 0; font-size: 62px; font-weight: 600; letter-spacing: -1.6px; line-height: 1.06; }
.headline--xl { font-size: 118px; letter-spacing: -3.6px; }
.headline__line { display: block; }
.headline__line--accent { color: var(--primary); }

.lede { margin: 26px 0 0; max-width: 1180px; font-size: 30px; line-height: 1.5; color: var(--on-surface-dim); }
.scene--center .lede { margin-inline: auto; }

.grid { display: grid; gap: 26px; width: 100%; max-width: 1560px; }
.grid--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid--matrix { grid-template-columns: 1.2fr .8fr; }
.grid--tight { margin-top: 26px; }

.card {
  min-width: 0;
  background: linear-gradient(180deg, var(--surface-2), var(--surface-1));
  border: 1px solid var(--outline); border-radius: var(--r-lg);
  padding: 32px 36px;
}
.card__title {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin: 0 0 18px; font-size: 27px; font-weight: 600; letter-spacing: -.4px;
}
.card__label {
  margin: 22px 0 12px; font-size: 16px; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase; color: var(--on-surface-dim);
}

.list { display: flex; flex-direction: column; gap: 13px; margin: 0; padding: 0; list-style: none; }
.list li { position: relative; padding-left: 30px; font-size: 24px; line-height: 1.45; color: var(--on-surface-dim); }
.list li::before {
  content: ""; position: absolute; left: 0; top: 13px;
  width: 11px; height: 11px; border-radius: 50%; background: var(--primary);
}
.list strong { color: var(--on-surface); font-weight: 600; }

code {
  font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: .86em; color: var(--primary);
  background: rgba(77, 208, 225, .1); padding: 1px 8px; border-radius: var(--r-sm);
}
.mono {
  margin: 0 0 18px; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: 22px; color: var(--secondary); overflow-wrap: anywhere;
}
.code {
  margin: 0 0 12px; padding: 16px 20px; overflow-wrap: anywhere;
  background: rgba(0, 0, 0, .34); border: 1px solid var(--outline);
  border-radius: var(--r-md);
}
.code code { background: none; padding: 0; font-size: 19px; color: var(--on-surface); }

.chiprow { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
.scene--center .chiprow { justify-content: center; }
.chip {
  padding: 9px 20px; border-radius: var(--r-full);
  background: var(--surface-3); border: 1px solid var(--outline);
  font-size: 20px; font-family: "JetBrains Mono", ui-monospace, monospace;
  color: var(--on-surface-dim);
}
.chip--accent { background: rgba(77, 208, 225, .14); border-color: rgba(77, 208, 225, .42); color: var(--primary); }

.badge {
  padding: 5px 14px; border-radius: var(--r-full);
  font-size: 15px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase;
}
.badge--ok { background: rgba(129, 199, 132, .16); color: var(--success); }
.badge--warn { background: rgba(255, 213, 79, .16); color: var(--warn); }

.steps { display: flex; flex-direction: column; gap: 16px; margin: 0; padding: 0; list-style: none; max-width: 1500px; }
.steps li {
  display: flex; align-items: center; gap: 22px;
  padding: 18px 26px; border-radius: var(--r-md);
  background: linear-gradient(90deg, var(--surface-2), var(--surface-1));
  border: 1px solid var(--outline);
  font-size: 25px; color: var(--on-surface-dim);
}
.steps__n {
  flex: 0 0 auto; display: grid; place-items: center;
  width: 46px; height: 46px; border-radius: 50%;
  background: rgba(77, 208, 225, .14); color: var(--primary);
  font-size: 22px; font-weight: 600;
}

.statrow { display: flex; gap: 26px; margin: 12px 0 26px; }
.stat {
  flex: 1; display: flex; flex-direction: column; gap: 6px;
  padding: 26px 32px; border-radius: var(--r-lg);
  background: linear-gradient(180deg, var(--surface-2), var(--surface-1));
  border: 1px solid var(--outline);
}
.stat__num { font-size: 58px; font-weight: 600; color: var(--primary); letter-spacing: -2px; }
.stat__label { font-size: 20px; color: var(--on-surface-dim); }

.table { width: 100%; border-collapse: collapse; font-size: 23px; }
.table th, .table td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--outline); }
.table th { font-size: 17px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--on-surface-dim); font-weight: 600; }
.table td { color: var(--on-surface-dim); }
.table td.mono { margin: 0; font-size: 21px; color: var(--secondary); }
.table tr:last-child td { border-bottom: none; }

.errow { display: flex; align-items: center; gap: 14px; margin: 0 0 12px; font-size: 21px; color: var(--on-surface-dim); }
.errow:last-child { margin-bottom: 0; }
.errow .chip { padding: 6px 14px; font-size: 18px; }
.errow__http { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 19px; color: var(--error); }

.note { margin: 26px 0 0; font-size: 22px; color: var(--on-surface-dim); max-width: 1500px; }

.tok {
  display: inline-block; padding: 2px 12px; border-radius: var(--r-full);
  font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 17px; margin-right: 6px;
}
.tok--code { background: rgba(77, 208, 225, .16); color: var(--primary); }
.tok--access { background: rgba(128, 203, 196, .16); color: var(--secondary); }
.tok--id { background: rgba(128, 203, 244, .16); color: var(--tertiary); }
.tok--refresh { background: rgba(255, 213, 79, .16); color: var(--warn); }

      [data-composition-src] { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>

      <script>
        (function () {
          var root = document.getElementById('root');
          var total = parseFloat(root.getAttribute('data-duration'));
          var timeline = gsap.timeline({ paused: true });

          timeline.from('.hf-rail__label', { opacity: 0, duration: 0.6, ease: 'power2.out' }, 0.35);
